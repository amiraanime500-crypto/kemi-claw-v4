[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kemi-claw"
version = "7.0.0"
description = "Kemi-Claw — an evidence-first, authorization-gated AI operations agent with a live command center."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "celery",
    "redis",
    "jinja2",
    "pyjwt",
    "bcrypt>=4",
    "python-multipart",
    "aiohttp",
    "apscheduler",
    "ddgs",
    "dnspython",
    "python-whois",
    "flower",
    "mcp==1.26.0",
    "pyautogui",
    "pyperclip",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
browser = ["playwright"]
computer = ["pygetwindow; platform_system == 'Windows'"]

[project.scripts]
kemi-claw = "kemi_claw.client:cli"

[tool.setuptools.packages.find]
include = ["kemi_claw*"]

[tool.pytest.ini_options]
testpaths = ["kemi_claw/tests"]
