name: Kemi CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m compileall -q kemi_claw
      - name: Run tests with diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p ci-reports
          status=0
          for f in kemi_claw/tests/test_*.py; do
            echo "=== $f ===" | tee "ci-reports/$(basename "$f").txt"
            pytest -q "$f" 2>&1 | tee -a "ci-reports/$(basename "$f").txt"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then status=1; fi
          done
          exit "$status"
      - name: Offline core benchmark
        if: always()
        run: python -m kemi_claw.core.benchmark | tee ci-reports/benchmark.json
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: ci-reports/
